<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Admin dashboard · SecureMarket</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="visually-hidden-focusable p-2" href="#main">Skip to content</a>
  <header id="app-nav"></header>
  <main class="container py-4" id="main">
    <div id="page-content" hidden>
      <h1 class="page-title mb-1">Admin dashboard</h1>
      <p class="text-body-secondary">Application activity and the security audit log. Visible to administrators only.</p>
      <div id="alert" aria-live="polite"></div>

      <section aria-labelledby="stats-h" class="mb-4">
        <h2 class="visually-hidden" id="stats-h">Activity summary</h2>
        <div class="row g-3" id="tiles"></div>
      </section>

      <section class="card" aria-labelledby="audit-h">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h2 class="h5 mb-0" id="audit-h">Audit log</h2>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-body-secondary" for="page-size">Rows</label>
              <select class="form-select form-select-sm w-auto" id="page-size"><option>10</option><option selected>20</option><option>50</option></select>
              <button class="btn btn-sm btn-outline-secondary" id="refresh" type="button">Refresh</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
              <thead class="table-light"><tr><th scope="col">Time</th><th scope="col">Action</th><th scope="col">Outcome</th><th scope="col">Actor</th><th scope="col">Target</th></tr></thead>
              <tbody id="audit-rows"></tbody>
            </table>
          </div>
          <div id="audit-pagination" class="mt-3"></div>
        </div>
      </section>
    </div>
  </main>
  <footer id="app-footer"></footer>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
